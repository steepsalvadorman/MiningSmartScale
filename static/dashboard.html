<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeighFlow IoT</title>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3a;
    --green:    #22c55e;
    --yellow:   #eab308;
    --red:      #ef4444;
    --blue:     #3b82f6;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --radius:   10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .04em; }
  .logo span { color: var(--blue); }
  #conn-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .82rem;
    color: var(--muted);
  }
  #conn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  #conn-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #conn-dot.disconnected { background: var(--red); }

  /* ── Main grid ───────────────────────────────────────────── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr;
    gap: 20px;
    padding: 24px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── Card base ───────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card-title {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ── Weight display ──────────────────────────────────────── */
  #weight-card {
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  #weight-value {
    font-size: 5.5rem;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1;
    transition: color .2s;
    font-variant-numeric: tabular-nums;
  }
  #weight-unit {
    font-size: 1.8rem;
    color: var(--muted);
    margin-top: -8px;
  }
  #stable-badge {
    padding: 6px 20px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .05em;
    transition: all .2s;
    background: var(--border);
    color: var(--muted);
  }
  #stable-badge.stable   { background: rgba(34,197,94,.15); color: var(--green); border: 1px solid var(--green); }
  #stable-badge.moving   { background: rgba(234,179,8,.12); color: var(--yellow); border: 1px solid var(--yellow); }

  #weight-meta {
    font-size: .78rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #weight-meta span { display: flex; align-items: center; gap: 6px; }

  .divider { width: 60%; height: 1px; background: var(--border); }

  /* ── Stats row ───────────────────────────────────────────── */
  #stats-card {
    display: flex;
    gap: 20px;
  }
  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .stat-value { font-size: 1.6rem; font-weight: 700; }

  /* ── History table ───────────────────────────────────────── */
  #history-card { overflow: hidden; }
  .table-wrap { overflow-y: auto; max-height: 360px; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th {
    position: sticky; top: 0;
    background: var(--surface);
    text-align: left;
    padding: 8px 10px;
    color: var(--muted);
    font-weight: 600;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr.new-row td { animation: flash .4s ease-out; }
  @keyframes flash { from { background: rgba(59,130,246,.18); } to { background: transparent; } }
  .badge-stable { color: var(--green); }
  .badge-moving  { color: var(--yellow); }
  .hmac-col { color: var(--muted); font-family: monospace; font-size: .7rem; }

  /* ── Download button ─────────────────────────────────────── */
  #download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 8px 18px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: opacity .15s;
  }
  #download-btn:hover { opacity: .85; }

  /* ── Responsive ──────────────────────────────────────────── */
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto; }
    #weight-card { grid-row: auto; min-height: 280px; }
    #weight-value { font-size: 4rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Weigh<span>Flow</span> IoT</div>
  <div id="conn-badge">
    <div id="conn-dot"></div>
    <span id="conn-label">Conectando…</span>
  </div>
</header>

<main>
  <!-- ── Peso actual ─────────────────────────────────────── -->
  <div class="card" id="weight-card">
    <div class="card-title">Lectura actual</div>
    <div id="weight-value">—</div>
    <div id="weight-unit">—</div>
    <div id="stable-badge">ESPERANDO</div>
    <div class="divider"></div>
    <div id="weight-meta">
      <span>🆔 ID: <b id="meta-id">—</b></span>
      <span>🕐 <span id="meta-time">—</span></span>
      <span title="HMAC-SHA256">🔐 <span id="meta-hmac" style="font-family:monospace;font-size:.7rem">—</span></span>
    </div>
  </div>

  <!-- ── Estadísticas ────────────────────────────────────── -->
  <div class="card" id="stats-card">
    <div class="stat">
      <div class="stat-label">Total lecturas</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Estables</div>
      <div class="stat-value" id="stat-stable" style="color:var(--green)">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">En movimiento</div>
      <div class="stat-value" id="stat-moving" style="color:var(--yellow)">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Último peso</div>
      <div class="stat-value" id="stat-last">—</div>
    </div>
  </div>

  <!-- ── Historial ───────────────────────────────────────── -->
  <div class="card" id="history-card">
    <div class="card-title">Historial de pesajes</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Hora</th>
            <th>Peso</th>
            <th>Unidad</th>
            <th>Estado</th>
            <th>HMAC</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <a id="download-btn" href="/export/csv" download>
      ⬇ Descargar CSV del turno
    </a>
  </div>
</main>

<script>
  // ── Estado ──────────────────────────────────────────────────────────────────
  const MAX_ROWS = 100;
  let counters = { total: 0, stable: 0, moving: 0 };
  let ws = null;
  let reconnectTimer = null;

  // ── DOM refs ─────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const weightEl  = $('weight-value');
  const unitEl    = $('weight-unit');
  const badgeEl   = $('stable-badge');
  const metaId    = $('meta-id');
  const metaTime  = $('meta-time');
  const metaHmac  = $('meta-hmac');
  const connDot   = $('conn-dot');
  const connLabel = $('conn-label');
  const tbody     = $('history-body');

  // ── Conexión WebSocket ────────────────────────────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/live`);

    ws.onopen = () => {
      connDot.className   = 'connected';
      connLabel.textContent = 'Conectado';
      clearTimeout(reconnectTimer);
    };

    ws.onmessage = evt => {
      try {
        const e = JSON.parse(evt.data);
        updateDisplay(e);
        updateStats(e);
        addRow(e);
      } catch (_) { /* ignorar mensajes malformados */ }
    };

    ws.onclose = () => {
      connDot.className   = 'disconnected';
      connLabel.textContent = 'Desconectado — reconectando…';
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
  }

  // ── Actualizar panel de peso ──────────────────────────────────────────────────
  function updateDisplay(e) {
    weightEl.textContent = e.value.toFixed(3);
    unitEl.textContent   = e.unit;
    metaId.textContent   = e.id;
    metaTime.textContent = fmtTime(e.timestamp_ms);
    metaHmac.textContent = e.hmac.slice(0, 16) + '…';

    if (e.stable) {
      weightEl.style.color = 'var(--green)';
      badgeEl.textContent  = '✓ ESTABLE';
      badgeEl.className    = 'stable';
    } else {
      weightEl.style.color = 'var(--yellow)';
      badgeEl.textContent  = '~ EN MOVIMIENTO';
      badgeEl.className    = 'moving';
    }
  }

  // ── Estadísticas ─────────────────────────────────────────────────────────────
  function updateStats(e) {
    counters.total++;
    e.stable ? counters.stable++ : counters.moving++;
    $('stat-total').textContent  = counters.total;
    $('stat-stable').textContent = counters.stable;
    $('stat-moving').textContent = counters.moving;
    $('stat-last').textContent   = `${e.value.toFixed(3)} ${e.unit}`;
  }

  // ── Agregar fila al historial ─────────────────────────────────────────────────
  function addRow(e) {
    const tr = document.createElement('tr');
    tr.className = 'new-row';
    tr.innerHTML = `
      <td>${e.id}</td>
      <td>${fmtTime(e.timestamp_ms)}</td>
      <td><b>${e.value.toFixed(3)}</b></td>
      <td>${e.unit}</td>
      <td class="${e.stable ? 'badge-stable' : 'badge-moving'}">${e.stable ? '✓ Estable' : '~ Movimiento'}</td>
      <td class="hmac-col" title="${e.hmac}">${e.hmac.slice(0, 8)}…</td>
    `;
    tbody.insertBefore(tr, tbody.firstChild);
    // Mantener máximo MAX_ROWS filas
    while (tbody.rows.length > MAX_ROWS) tbody.deleteRow(tbody.rows.length - 1);
  }

  // ── Formatear timestamp ────────────────────────────────────────────────────────
  function fmtTime(ms) {
    const d = new Date(ms);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    return `${hh}:${mm}:${ss}`;
  }

  // ── Cargar historial inicial via REST ─────────────────────────────────────────
  async function loadHistory() {
    try {
      const resp = await fetch('/events');
      if (!resp.ok) return;
      const events = await resp.json();
      // Mostrar los últimos MAX_ROWS en orden descendente
      events.slice(-MAX_ROWS).reverse().forEach(e => {
        updateStats(e);
        addRow(e);
      });
      if (events.length > 0) updateDisplay(events[events.length - 1]);
    } catch (_) { /* si la API no responde todavía, ignorar */ }
  }

  // ── Inicio ────────────────────────────────────────────────────────────────────
  loadHistory();
  connect();
</script>
</body>
</html>
