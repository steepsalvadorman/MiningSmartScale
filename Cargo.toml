[package]
name = "weighflow"
version = "0.3.0"
edition = "2024"

[dependencies]
# Async runtime
tokio        = { version = "1",   features = ["full"] }

# Serial
tokio-serial = "5"
serialport   = "4"

# Web / WebSocket
axum         = { version = "0.8", features = ["ws"] }
tower-http   = { version = "0.6", features = ["cors"] }

# Criptografía
hmac         = "0.12"
sha2         = "0.10"
hex          = "0.4"

# Serialización
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errores
anyhow    = "1"
thiserror = "2"
bytes     = "1"

# Wedge mode — simulación de teclado
# default-features=false evita depender de libxdo; x11rb es pure-Rust y ya está en el árbol
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }

# Portapapeles (cross-platform)
arboard = "3"

# PTY para el simulador (Linux)
libc = "0.2"

[dev-dependencies]
tower        = { version = "0.5", features = ["util"] }
serde_json   = "1"
axum         = { version = "0.8", features = ["ws"] }
tokio        = { version = "1", features = ["full"] }
